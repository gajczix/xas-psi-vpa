apiVersion: v1
kind: ServiceAccount
metadata:
  name: xas-psi-metrics-provider
  namespace: xas-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: xas-psi-metrics-provider
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["xas.io"]
    resources: ["scalingpolicies", "metricproviderclasses"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: xas-psi-metrics-provider
subjects:
  - kind: ServiceAccount
    name: xas-psi-metrics-provider
    namespace: xas-system
roleRef:
  kind: ClusterRole
  name: xas-psi-metrics-provider
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: xas.io/v1
kind: MetricProviderClass
metadata:
  name: psi
spec:
  type: PSI
  config:
    cgroupRoot: "/sys/fs/cgroup"
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: xas-psi-metrics-provider
  namespace: xas-system
spec:
  selector:
    matchLabels:
      app: xas-psi-metrics-provider
  template:
    metadata:
      labels:
        app: xas-psi-metrics-provider
    spec:
      serviceAccountName: xas-psi-metrics-provider
      containers:
        - name: provider
          image: ko://xas-psi-vpa/psi-metrics-provider
          args:
            - "--server-address=xas-server.xas-system.svc.cluster.local:80"
            - "--node-name=$(NODE_NAME)"
            - "--cluster-name=default"
            - "--cgroup-root=/sys/fs/cgroup"
            - "--scrape-interval=2s"
            - "--debug"
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          volumeMounts:
            - name: cgroup
              mountPath: /sys/fs/cgroup
              readOnly: true
      volumes:
        - name: cgroup
          hostPath:
            path: /sys/fs/cgroup
            type: Directory
