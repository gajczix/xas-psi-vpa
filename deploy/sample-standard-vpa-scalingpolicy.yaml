apiVersion: xas.io/v1
kind: ScalingPolicy
metadata:
  name: thrashing-app-standard-vpa
  namespace: default
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: thrashing-app
  minReplicas: 1
  maxReplicas: 1

  metrics:
    # Standard Kubelet memory metric: container_memory_working_set_bytes (memory.current - inactive_file)
    - name: "working_set_memory"
      provider: "kubelet"
      scope: "PodContainer"
      params:
        type: "memory"
      gauge:
        aggregation: "Max"

  scaling:
    # Standard xAS built-in VPA recommender (working_set_bytes * 1.15)
    - recommender: "vpa"
      name: "standard_vpa"
      params:
        container: "app"
        mem-metric: "working_set_memory"
        mem-safety-margin: "1.15"
