apiVersion: v1
kind: ServiceAccount
metadata:
  name: xas-psi-vpa-recommender
  namespace: xas-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: xas-psi-vpa-recommender
rules:
  - apiGroups: ["xas.io"]
    resources: ["recommenderclasses"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: xas-psi-vpa-recommender
subjects:
  - kind: ServiceAccount
    name: xas-psi-vpa-recommender
    namespace: xas-system
roleRef:
  kind: ClusterRole
  name: xas-psi-vpa-recommender
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: xas.io/v1
kind: RecommenderClass
metadata:
  name: psi-vpa
spec:
  type: PSIVPA
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: xas-psi-vpa-recommender
  namespace: xas-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: xas-psi-vpa-recommender
  template:
    metadata:
      labels:
        app: xas-psi-vpa-recommender
    spec:
      serviceAccountName: xas-psi-vpa-recommender
      containers:
        - name: recommender
          image: ko://xas-psi-vpa/psi-vpa-recommender
          args:
            - "--server-address=xas-server.xas-system.svc.cluster.local:80"
            - "--cluster-name=default"
            - "--eval-interval=5s"
            - "--debug"
